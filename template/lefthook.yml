pre-commit:
  parallel: true
  commands:
    lint:
      run: bun run lint
    no-console:
      run: |
        if grep -R --exclude-dir=node_modules "console\.log" .opencode/plugins .opencode/tools 2>/dev/null; then
          echo "Use client.app.log() or the Logger helper in plugin code."
          exit 1
        fi

pre-push:
  commands:
    test:
      run: bun test tests/plugin.test.ts
