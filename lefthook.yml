pre-commit:
  parallel: true
  commands:
    lint:
      run: bun run lint
    template-no-console:
      run: |
        if grep -R "console\.log" template/.opencode/plugins template/.opencode/tools 2>/dev/null; then
          echo "Use client.app.log() or the Logger helper in generated plugin code."
          exit 1
        fi

pre-push:
  commands:
    test:
      run: bun test
