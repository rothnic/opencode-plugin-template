pre-commit:
  parallel: true
  commands:
    lint:
      run: bun run lint
    template-no-console-warn:
      run: bun run scripts/check-plugin-logging.ts warn template

pre-push:
  commands:
    template-no-console-block:
      run: bun run scripts/check-plugin-logging.ts block template
    test:
      run: bun test
